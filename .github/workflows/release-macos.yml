name: Build and release installers

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Параллельные версии не смешивают артефакты; публикация ждёт обе платформы.
concurrency:
  group: cue-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win -- --publish never
          - os: macos-latest
            platform: macos
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Закрепляем проверенные Actions, чтобы тег действия не менял сборку.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # На Windows проверяем интерфейс и запись; macOS проверяет оба упакованных приложения.
      - name: Verify transcript UI
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Verify meeting capture and recovery
        if: runner.os == 'Windows'
        run: npm run test:assistant
      - name: Verify independent windows
        if: runner.os == 'Windows'
        run: npm run test:behavior
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Build installers
        run: ${{ matrix.command }}
      - name: Verify packaged source and Python workers
        run: node scripts/verify-package.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-${{ matrix.platform }}-installers
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cue-*-installers
          path: installers
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for asset in "cue-$version-windows-x64.exe" "cue-$version-mac-x64.zip" "cue-$version-mac-arm64.zip"; do
            test -s "installers/$asset"
          done
          (cd installers && sha256sum *.exe *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --draft --title "cue $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
