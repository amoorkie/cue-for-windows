name: Release macOS installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS app archives for Intel and Apple Silicon
        run: npm run dist:mac

      - name: Publish macOS release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "cue $GITHUB_REF_NAME"

      - name: Save macOS installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cue-macos-installers
          path: |
            dist/*.zip
          if-no-files-found: error
