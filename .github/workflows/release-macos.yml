name: Build and release installers

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win -- --publish never
          - os: macos-latest
            platform: macos
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Build installers
        run: ${{ matrix.command }}
      - name: Verify packaged source and Python workers
        run: node scripts/verify-package.js
      - uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.platform }}-installers
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cue-*-installers
          path: installers
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for asset in "cue-$version-windows-x64.exe" "cue-$version-mac-x64.zip" "cue-$version-mac-arm64.zip"; do
            test -s "installers/$asset"
          done
          (cd installers && sha256sum *.exe *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --draft --title "cue $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
